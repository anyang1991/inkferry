plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "press.aresan02.inkferry"
    compileSdk 35

    defaultConfig {
        applicationId "press.aresan02.inkferry"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "0.1.3"
    }

    flavorDimensions "architecture"
    productFlavors {
        arm64 {
            dimension "architecture"
            ndk { abiFilters "arm64-v8a" }
        }
        emulator {
            dimension "architecture"
            ndk { abiFilters "x86_64" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def sharedPython = layout.buildDirectory.dir("generated/inkferry")
def stageSharedCode = tasks.register("stageSharedCode", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "server.py", "book.py", "mobi.py", "index.html", "app.js",
                "style.css", "kindle.css", "kindle.js", "favicon.svg"
    }
    into sharedPython
}

chaquopy {
    defaultConfig {
        version = "3.13"
    }
    sourceSets.getByName("main") {
        srcDir(sharedPython)
    }
}

tasks.configureEach {
    if (name == "preBuild" || name.endsWith("PythonSources")) {
        dependsOn(stageSharedCode)
    }
}
